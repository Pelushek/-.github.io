.info-block{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}

.bb-content { background: var(--paper); border: 1px solid var(--line); border-radius: 15px; padding: 25px; box-shadow: var(--shadow); max-width: 900px; margin: 0 auto; color: var(--ink); line-height: 1.6; }

.bb-content p { margin: 0 0 10px; font-size: 13px; text-align: left; }
.bb-content ul { margin: 0 0 15px; padding-left: 20px; font-size: 13px; }
.bb-content li { margin-bottom: 5px; }
.bb-content table { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-size: 13px; }
.bb-content th, .bb-content td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }

  <h2 style="color: var(--accent); text-align: center; font-size: 22px; margin: 15px 0 20px 0; display: block; width: 100%;">СОЗДАНИЕ ИДЕИ ДЛЯ БУДУЩЕГО МЕРОПРИЯТИЯ</h2>
  
  <p>У вас есть идея для мероприятия? Вы хотите порадовать племя и предложить ему занимательное времяпровождение? Тогда самое время стать заказчиком и обратиться к нам со своей идеей!</p>
  <p><i>Перед тем как писать с предложением мероприятия, ознакомьтесь с разделом по организации в <a href="https://catwar.net/about?id=14" target="_blank" style="color: var(--accent); text-decoration: underline;">"об игре."</a></i></p>

  <h3>Правила создания ивентов</h3>
  <p><b>Заказчик</b> — кот от должности "оруженосец" с собственной идеей и программой для мероприятия. Может как подкинуть материал, так и полноценно участвовать в процессе его создания. Котята также могут предлагать варианты мероприятий и участвовать в разработке, при условии, что ранее находились в Сумраке с должностью выше оруженосца.</p>
  <p>У заказчика обязательно должны быть:</p>
  <ul>
    <li><b>Идея</b> [общий замысел, история, краткое описание];</li>
    <li><b>Этапы</b> [порядок прохождения квеста] и условия [если необходимы костюмы, предметы и их функции];</li>
    <li><b>Роли</b> [если необходимо участие аниматоров].</li>
  </ul>

          <p style="margin: 0;">Масштабное племенное событие, схожее с сайтовыми квестами. Для племенных игр доступно создание ботов, новых временных локаций, эффектов на локации и так далее. Племенные игры проводятся в той же вселенной, в которой живет племя [это значит, что все игроки будут находиться на играх вместе, а не в приватных вселенных]. Племенные игры проводятся с помощью администрации [а точнее — команды квестовиков], поэтому запрашивать их нужно за полгода до проведения. НО! Если племя может самостоятельно сделать всё, кроме установки [прописать предметы, диалоги в формате диалогов ботов, локации и переходы], то срок запроса можно сократить до двух месяцев до начала игр. Конкретные сроки обговариваются в ЛС с Квестовиком.</p>
        </div>
        <div style="margin-bottom: 15px;">
          <b style="background: #e0dbd3; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 5px;">СЕЗОННЫЕ ИГРЫ</b>
          <p style="margin: 0;">Это временное мероприятие, проводимое для определенной/нескольких фракци[и/й] раз в сезон, тематика которых не ограничена только лором племени/мифологиями стран и etc. В рамках мероприятия можно устанавливать костюмы, менять фоны и скины дичи, блогеров, КсД. Призы подбираются, чаще, в зависимости от сложности мероприятия [пример: костюмы/ДИ на 2 недели, медали, баллы в КА, уникальный предмет и др].</p>
        </div>
        <div style="margin-bottom: 15px;">
          <b style="background: #e0dbd3; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 5px;">МЕЖПЛЕМЕННОЕ МЕРОПРИЯТИЕ</b>
          <p style="margin: 0;">Мероприятие, в котором принимают участие два и более племени/клана. Может проходить как в формате <b>ярмарки</b> [<i>на мероприятии имеются вариативные способы досуга, игрок не находится в рамках одной сферы [охоты/патрули/дозоры и т.п.] и волен заниматься всем, чем ему захочется</i>], так и <b>турнира</b> [<i>мероприятие, нацеленное сугубо на одну определенную сферу, например — охотничий турнир</i>], <b>фестиваля</b> [<i>мероприятие, имеющее определенную программу, отходить от которой участники не могут</i>], <b>забега</b> [<i>мероприятие, нацеленное на соревнование в первенстве, например — забег по горам</i>], <b>эстафеты</b> [<i>интерактивное мероприятие, представляющее собой постановку с элементами фестиваля, например — поиск предмета</i>] или <b>постановки</b> [<i>мероприятие, нацеленное на спокойное и размеренное времяпровождение, в основном повествующее или показывающее что-либо, например — вечер сказок</i>].</p>

        <div style="margin-bottom: 15px;">
          <b style="background: #e0dbd3; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 5px;">ОБЩЕЕ МЕРОПРИЯТИЕ</b>
          <p style="margin: 0;">Ровно то же самое, что и межплеменное мероприятие, однако, участником может быть лишь Племя Теней.</p>
        </div>
        <div>
          <b style="background: #e0dbd3; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 5px;">ВОРОЖБА ТЕНЕЙ</b>
          <p style="margin: 0;">Небольшое мероприятие, механикой которого являются только интерактивы. Проводятся ежемесячно в группе племени в ВК, участвовать могут все, кто находится и проживает в Тенях вне зависимости от должности. Это может быть как <i>однодневный интерактив, так и небольшая цепочка из заданий одного или разных видов, публикующихся каждый день в течение n-ного срока.</i> Ворожба Теней не является масштабным мероприятием, поэтому в призах обычно не используются костюмы и медали.</p>

      <summary style="background: #2b3b2b; color: #f2eeef; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; list-style: none;">
        Памятка по созданию ивентов
      </summary>
      <div style="padding: 15px 20px; font-size: 13px;">
        
        <div style="margin-bottom: 20px;">
          <b style="background: #e0dbd3; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px;">ПРАВИЛА</b>
          <ol style="padding-left: 20px; margin: 0;">
            <li style="margin-bottom: 5px;"><b>Нельзя распространять информацию по ивентам вне аниматоров и заказчиков, а также пользоваться слитой информацией.</b><br><span style="color: var(--muted); font-size: 12px;">– задания/другая информация, которая влияет на прохождение ивента и/или может осуществить нечестную победу участника.</span></li>
            <li style="margin-bottom: 5px;"><b>Заказчики, которые допустили серьезные ошибки и отказались их исправлять/прислушаться к мнению не будут допущены к работе.</b></li>
            <li style="margin-bottom: 5px;"><b>В месяц нельзя провести больше одного ивента с костюмами и/или сменой дичи, из-за лимита в об игре.</b></li>
            <li style="margin-bottom: 5px;"><b>Заказчики и аниматоры работающие над ивентом не могут участвовать в ивенте в качестве игроков.</b><br><span style="color: var(--muted); font-size: 12px;">– Данное правило вытекает из 1 пункта, так как сами аниматоры и заказчики знают суть ивента с ответами на задания, а значит имеют преимущество над остальными участниками.</span></li>

        <div style="margin-bottom: 20px;">
          <b style="background: #e0dbd3; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px;">ЭТАПЫ СОЗДАНИЯ ИВЕНТА</b>
          <ol style="padding-left: 20px; margin: 0;">
            <li style="margin-bottom: 10px;"><b>Диалоги для актеров</b><br>– реплики, передающие сюжет, которые актеры говорят в чат игровой. Для их написания вы можете обратиться к аниматорам, для этого вам желательно составить хотя бы примерный список действующих лиц.</li>
            <li style="margin-bottom: 10px;"><b>Задания</b><br>– Загадки/задачи/соревнования/кроссворды и прочее, что является непосредственной составляющей ивента.<br>– Задачи могут быть вне игровой [конкурс по рисованию рисунка], в игровой [охотничье соревнование], частично в игровой и вне ее [актер может выдать кроссворд, который нужно будет решить и отправить ему].<br>– <b>Помните</b>, что если ваше задание на скорость в игровой, то <b>запретите</b> пользоваться ускорителями, обговаривайте это в условиях записи на ивент, у игроков должен быть одинаковый переход, чтобы обеспечить равные шансы.<br>– Также учитывайте свободные места игроков, попросите их освободить рот перед началом этапа, например, связанного с охотой, учитывайте правила посещения нейтральных локаций, участник ивента не должен нарушать племенных правил для выполнения задач.<br>– Нужная информация для выполнения заданий должна находиться в свободном доступе или выдаваться организаторами.</li>
            <li style="margin-bottom: 10px;"><b>Костюмы</b><br>– Костюм, который ставят на модельку персонажа, не вместо неё.<br>– Делятся на <b>два</b> типа: <b>закрытые</b> и <b>открытые</b>.<br>
              <table style="width: 100%; margin: 10px 0; font-size: 12px; border: none;">
                <tr>
                  <td style="width: 50%; border: none; padding: 5px; text-align: center; background: #fdf6f3;"><b>Закрытые</b> перекрывают фоном модельку персонажа, из-за чего самого игрока не видно.</td>
                  <td style="width: 50%; border: none; padding: 5px; text-align: center; background: #f7f4ef;"><b>Открытые</b> представляют собой украшения на модельку игрока, не закрывающие ее полностью, лишь некоторую часть.</td>
                </tr>
              </table>
              – Костюмы может устанавливать только верх через привилегии.<br>– Костюмы могут быть установлены как всем участникам ивента, так и всему племени.</li>
            <li style="margin-bottom: 10px;"><b>Актеры</b><br>Игроки, которые отыгрывают роли. Их задачей является написание в чат реплик из заранее подготовленных диалогов. Реплики могут быть также оформлены в личных сообщениях или в о себе в профиле. На время мероприятиям им можно сменить имена и/или поставить костюм через верх племени.</li>
            <li style="margin-bottom: 10px;"><b>Фоны</b><br>– Могут быть украшены теневые фоны какими-либо деталями или поставлены фоны, нарисованные с нуля.<br>– Меняются фоны через верх.<br>– Названия локаций быть изменены <b>не могут</b>.</li>
            <li style="margin-bottom: 10px;"><b>Дичь</b><br>– Ее скин может быть заменён на что-то другое, к примеру, вместо мыши, вы можете поставить леденец.<br>– Заменяет дичь <b>не верх, а администрация</b>, запрос идёт через верх Маляру, <b>процесс может быть долгим</b>.</li>
            <li style="margin-bottom: 10px;"><b>Блог/пост с баннером/документом</b><br>– Для ивента может быть создан блог со всей информацией об мероприятии, который может быть опубликован через Змея верхом.<br>– <b>НО</b> для ивента также может использоваться пост в группе Теней с баннером/документом со всей нужной информацией.</li>
            <li style="margin-bottom: 10px;"><b>Имена актеров</b><br>– <b>НЕ</b> длиннее <b>30 символов</b>, включая пробел.<br>– Буквы используются <b>только</b> из Кириллицы.<br>– Не больше двух слов в имени, одно или оба слова пишутся с заглавных букв.<br><br><b>Важно!!</b> Актеры должны учитывать, что их <b>племенное имя верх занять не сможет</b>, поэтому существует вероятность того, что оно будет взято другим игроком. Перепись может помочь только в том случае, если игроку, который занял имя, младше 6 лун или он не заходит в игру больше месяца и проживает в Звёздном племени, Сумрачном лесу, Душевой, Домашних или одиночках/изгнанниках.</li>
          </ol>
        </div>

        <div>
          <b style="background: #e0dbd3; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px;">НАГРАДЫ И ПРИЗЫ</b>
          <ol style="padding-left: 20px; margin: 0;">

function aWorks(a){return works.filter(w=>w.artistId===a.id)}
function rawPoints(a){return aWorks(a).reduce((s,w)=>s+(Number(w.points)||0),0)}
function spentPoints(a){return 0;} 
function currentPoints(a){return Math.max(0, rawPoints(a) - spentPoints(a));}

function rawBonusPoints(a) {
    let aw = aWorks(a);
    if (aw.length < 3) return 0;
    let sorted = [...aw].sort((x,y) => parseDate(x.date) - parseDate(y.date));
    let totalBonus = 0;
    for (let i = 0; i + 2 < sorted.length; i += 3) {
        let sum = (Number(sorted[i].points)||0) + (Number(sorted[i+1].points)||0) + (Number(sorted[i+2].points)||0);
        totalBonus += sum / 3;
    }
    return Math.round(totalBonus * 10) / 10;
}

function spentNb(a) {
    let spent = 0;
    purchases.filter(p => p.artistId === a.id).forEach(p => {
        let reward = ALL_REWARDS.find(r => slug(r.name) === slug(p.rewardName));
        if (reward && reward.isNb && reward.spend !== false) spent += reward.price * (p.qty || 1);
    });
    return spent;
}

function currentBonusPoints(a) {
    return Math.max(0, Math.round((rawBonusPoints(a) - spentNb(a)) * 10) / 10);
}

// ===== ЛОГИКА ДЛЯ АНИМАТОРОВ =====
function aEvents(a){return animatorEvents.filter(e=>e.animatorId===a.id)}
function animatorPoints(a){return aEvents(a).reduce((s,e)=>s+(Number(e.points)||0),0)}

function parseDate(dStr) {
    if (!dStr) return 0;
    let parts = dStr.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
    if (parts) {
        let day = parseInt(parts[1], 10);
        let month = parseInt(parts[2], 10) - 1;
        let year = parseInt(parts[3], 10);
        if (year < 100) year += 2000; 
        return new Date(year, month, day).getTime();
    }
    parts = dStr.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (parts) return new Date(parts[1], parts[2]-1, parts[3]).getTime();
    let t = Date.parse(dStr);
    return isNaN(t) ? 0 : t;
}

async function fetchCSV(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new Error('таблица недоступна (проверьте доступ по ссылке)');
  return parseCSV(text);
}

async function fetchData() {
  $('loadingOverlay').style.display = 'flex';
  const names = ['Работы живописцев', 'Покупки живописцев', 'Аниматоры'];
  const results = await Promise.allSettled([fetchCSV(CSV_URL), fetchCSV(PURCHASES_URL), fetchCSV(ANIMATORS_URL)]);
  const errors = [];
  results.forEach((r, i) => { if (r.status === 'rejected') errors.push(names[i] + ': ' + ((r.reason && r.reason.message) || r.reason)); });
  try {
    // порядок важен: покупки привязываются к уже загруженным художникам
    if (results[0].status === 'fulfilled') importRows(results[0].value);
    if (results[1].status === 'fulfilled') importPurchases(results[1].value);
    if (results[2].status === 'fulfilled') importAnimators(results[2].value);
  } catch (e) {
    errors.push('Ошибка обработки данных: ' + e.message);
  }
  $('loadingOverlay').style.display = 'none';
  if (errors.length) alert('Не удалось загрузить:\n' + errors.join('\n'));
  render();
}

const SPECIAL_REWARDS = ['Костюм живописцев', 'Медаль мероприятия'];
const SORT_ALL = '<option value="name">По имени</option><option value="points">По баллам ↓</option><option value="date_desc">По дате (сначала новые)</option><option value="date_asc">По дате (сначала старые)</option>';
const SORT_NP = '<option value="name">По имени</option><option value="points">По баллам ↓</option>';

function isRewardBought(a, title) {
  const def = ALL_REWARDS.find(r => slug(r.name) === slug(title));
  if (def && def.repeat) return false;
  return purchases.some(p => p.artistId === a.id && slug(p.rewardName) === slug(title));
}

// Общая карточка награды (живописцы и аниматоры)
function makeRewardCard(ctx) {
  return (title, desc, price, isNb, imgUrl, isLifetime = false) => {
    let avail = false;
    let statusHtml = '';
    let currentValue = isNb ? (isLifetime ? ctx.rawNb : ctx.nb) : ctx.pts;
    let typeName = isNb ? 'НБ' : 'баллов';
    let isBought = false;
    const isSpecial = SPECIAL_REWARDS.includes(title);

    if (ctx.checked) isBought = ctx.isBoughtFn(title);

    if (isSpecial) {
      if (isBought) {
        statusHtml = `<div class="reward-status status-avail" style="display:block; background:#e8f5e9; color:#2e7d32; padding:5px; border-radius:6px; margin-top:8px;">Выдан (внесен в таблицу)</div>`;
      } else {
        statusHtml = `<div class="reward-status status-no" style="background:#f0f0f0; color:#666; border-color:#ddd;">Выдается вручную</div>`;
      }
    } else if (ctx.checked && !isBought) {
      avail = currentValue >= price;
      statusHtml = avail ? `` : `<div class="reward-status status-no">До награды: не хватает ${Math.round((price - currentValue) * 10) / 10} ${typeName}</div>`;
    }

    let imgHtml = imgUrl ? `<img src="${esc(imgUrl)}" class="reward-img" alt="">` : `<div class="reward-img">Нет фото</div>`;
    let descHtml = desc ? `<div class="reward-desc">${desc}</div>` : '';

    let cardClass = 'reward-card';
    if (avail && !isBought) cardClass += ' available';
    if (isBought) cardClass += ' bought';

    let priceDisplay = isSpecial
      ? `<span style="font-weight:400; font-size:11px; color:var(--muted);">Особое условие</span>`
      : `${isNb ? 'НБ: ' : 'Баллов: '}${price} ${isLifetime ? '<span style="font-size:10px;font-weight:400;color:var(--muted)">(за всю жизнь)</span>' : ''}`;

    return `<div class="${cardClass}">
        ${imgHtml}
        <div class="reward-info">
            <div class="reward-title">${esc(title)}</div>
            ${descHtml}
            <div class="reward-price">${priceDisplay}</div>
            ${statusHtml}
        </div>
    </div>`;
  };
}

 $('workspace').style.display = 'block';

 let q = slug($('search').value);
 let filter = $('artistFilter').value;
 let spec = $('specFilter').value;
 let sort = $('sort').value;
 
 let list=artists.filter(a=>{
   if (filter && a.id !== filter) return false;

 });
 
 list.sort((a,b)=>{

 });

function setView(v){
  view = v;
  // сбрасываем фильтры и панель, чтобы скрытые фильтры не влияли на другие вкладки
  $('artistFilter').value = ''; $('specFilter').value = ''; $('animSpecFilter').value = '';
  $('sort').innerHTML = SORT_ALL; $('sort').value = 'name';
  ['sort','artistFilter'].forEach(id => $(id).style.display = 'block');
  ['specFilter','animSpecFilter'].forEach(id => $(id).style.display = 'none');
  const animNav = document.getElementById('animatorsSubNav');
  const paintNav = document.getElementById('paintersSubNav');
  const menuBtns = document.querySelectorAll('.nav > button');
  const brandTitle = document.getElementById('brandTitle');
  
  // Закрываем все подменю и убираем активный класс у всех кнопок
  animNav.classList.remove('open');
  paintNav.classList.remove('open');
  menuBtns.forEach(b => b.classList.remove('active'));
  animNav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  paintNav.querySelectorAll('button').forEach(b => b.classList.remove('active'));

  // Аниматоры
  if (v.startsWith('animators')) {
    animNav.classList.add('open');
    document.getElementById('animatorsMenuBtn').classList.add('active');
    animNav.querySelector(`[data-view="${v}"]`).classList.add('active');
    brandTitle.textContent = 'Аниматоры';

    $('workspace').style.display = 'block';
    $('pageTitle').textContent = ({
        animators_stats: 'Все аниматоры',
        animators_board: 'Доска мероприятий',
        animators_rewards: 'Награды и разбалловка'
    })[v] || 'Аниматоры';
    
    // Управление фильтрами
    document.querySelector('.toolbar').style.display = v === 'animators_rewards' ? 'none' : 'flex';
    document.getElementById('animSpecFilter').style.display = v === 'animators_stats' ? 'block' : 'none';
    $('artistFilter').style.display = v === 'animators_stats' ? 'none' : 'block';
    $('sort').innerHTML = v === 'animators_stats' ? SORT_NP : SORT_ALL;
    $('sort').value = 'name';
    document.getElementById('specFilter').style.display = 'none';

    render();
    return;
  }
  
  // Живописцы
  if (['artists', 'board', 'works', 'rewards'].includes(v)) {
    paintNav.classList.add('open');
    document.getElementById('paintersMenuBtn').classList.add('active');
    paintNav.querySelector(`[data-view="${v}"]`).classList.add('active');
    brandTitle.textContent = 'Живописцы';

    $('workspace').style.display = 'block';
    $('pageTitle').textContent=({board:'Доска художников',artists:'Все художники',works:'Все работы',rewards:'Награды и разбалловка'})[v];
    $('listTitle').textContent=({board:'Рабочее пространство',artists:'Список художников',works:'Реестр работ',rewards:'Награды'})[v];
    $('listSub').textContent=({board:'Выберите художника',artists:'Нажмите на карточку',works:'Все начисления в одном списке',rewards:'Информация о наградах и баллах'})[v];
    
    document.querySelector('.toolbar').style.display = v === 'rewards' ? 'none' : 'flex';
    document.getElementById('animSpecFilter').style.display = 'none';

    if (v === 'board') {
        document.getElementById('specFilter').style.display = 'none';
        document.getElementById('sort').style.display = 'none';
        document.getElementById('artistFilter').style.display = 'block';
    } else if (v === 'artists') {
        document.getElementById('specFilter').style.display = 'block'; // Возвращаем фильтр!
        document.getElementById('sort').style.display = 'block';
        document.getElementById('artistFilter').style.display = 'none';
        let sortSelect = document.getElementById('sort');
        sortSelect.innerHTML = `<option value="name">По имени</option><option value="points">По баллам ↓</option>`;
    } else if (v === 'works') {
        document.getElementById('specFilter').style.display = 'none';
        document.getElementById('sort').style.display = 'block';
        document.getElementById('artistFilter').style.display = 'block';
        let sortSelect = document.getElementById('sort');
        sortSelect.innerHTML = `<option value="name">По имени</option><option value="points">По баллам ↓</option><option value="date_desc">По дате (сначала новые)</option><option value="date_asc">По дате (сначала старые)</option>`;
    }

    const statsBlock = document.querySelector('.stats');
    if (v === 'board' || v === 'works' || v === 'rewards') {
        statsBlock.style.display = 'none';
    } else {
        statsBlock.style.display = 'grid';
    }

    render();
    return;
  }

  // Писатели / Оформители / Главная
  document.querySelector(`.nav > button[data-view="${v}"]`)?.classList.add('active');
  
  if (v === '') {
    brandTitle.textContent = 'Мастерская чудес';
    view = '';
    render();
    return;
  }

  if (v === 'writers') brandTitle.textContent = 'Писатели';
  else if (v === 'designers') brandTitle.textContent = 'Оформители';
  
  $('workspace').style.display = 'none';
  $('content').innerHTML = '';
}

function parseCSV(text){
    let first=text.split(/\r?\n/)[0]||'';
    let del=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
    let rows=[],row=[],v='',q=false,s=text.replace(/^\ufeff/,'');
    for(let i=0;i<s.length;i++){
        let c=s[i];
        if(c==='"'&&q&&s[i+1]==='"'){v+='"';i++}
        else if(c==='"')q=!q;
        else if(c===del&&!q){row.push(v);v=''}
        else if((c==='\n'||c==='\r')&&!q){
            if(c==='\r'&&s[i+1]==='\n')i++;
            row.push(v);
            if(row.some(x=>x.trim()))rows.push(row);
            row=[];v=''
        } else v+=c;
    }
    row.push(v);
    if(row.some(x=>x.trim()))rows.push(row);
    return rows;
}
function makeIdx(headers){
  return (...names) => {
    const keys = names.map(norm);
    for (const k of keys) { const i = headers.findIndex(h => h === k); if (i >= 0) return i; }
    for (const k of keys) {
      const i = headers.findIndex(h => k.length > 3 ? h.includes(k) : (h.startsWith(k) || h.endsWith(k)));
      if (i >= 0) return i;
    }
    return -1;
  };
}
function norm(s){return String(s||'').toLowerCase().replace(/[ё]/g,'е').replace(/[^a-zа-я0-9]+/g,'')}

function importRows(rows){
 if(!rows.length)return;
 artists=[]; works=[];
 let headers=rows[0].map(norm),idx=makeIdx(headers);
 
 let ni=idx('имя художника','имя','художник');
 let avi=idx('аватар'); 
 let vi=idx('вк','vk');
 let ci=idx('catwar'); 
 let pi=idx('профильность','спец');
 let bi=idx('описание','коммент');
 let wi=idx('название работ','работа','название');
 let cati=idx('категория','тип');
 let ui=idx('ссылка на работу','ссылка','url');
 let di=idx('дата');
 let pti=idx('баллы','очки');

 rows.slice(1).forEach(r=>{
  let name=(r[ni]||'').trim();if(!name)return;
  let catwarValue = ci>=0 ? (r[ci]||'').trim() : ''; 
  
  let a=artists.find(a=>slug(a.name)===slug(name));
  
  if(!a){
    a={
      id:'a'+artists.length, 
      name, 
      catwar: catwarValue, 
      vk: vi>=0?r[vi]||'':'', 
      profile: pi>=0?r[pi]||'':'', 
      bio: bi>=0?r[bi]||'':'',
      avatar: avi>=0?r[avi]||'':''
    };
    artists.push(a);
  } else {
    if (!a.vk && vi>=0) a.vk = r[vi]||'';
    if (!a.avatar && avi>=0) a.avatar = r[avi]||'';
    if (!a.catwar && ci>=0) a.catwar = catwarValue;
  }
  
  if(wi>=0 && (r[wi]||'').trim()){
   let category=(cati>=0?r[cati]:'').trim();
   let known=CATS.find(c=>norm(c)===norm(category))||'Иное';
   
   works.push({
       id:'w'+works.length,
       artistId:a.id,
       title:r[wi].trim(),
       category:known,
       url:ui>=0?r[ui]||'':'',
       date:di>=0?r[di]||'':'',
       points:pti>=0?Number(String(r[pti]||'0').replace(',','.'))||0:0
   });
  }
 });
}
